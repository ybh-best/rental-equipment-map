<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>门店在租设备分布图</title>
  <link rel="stylesheet" href="./style.css?v=1.4.0">
  <script src="./echarts.min.js" onerror="this.onerror=null;this.src='https://registry.npmmirror.com/echarts/5.5.1/files/dist/echarts.min.js'"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">📍</span>
      <div>
        <h1>门店在租设备分布图</h1>
        <p>剪刀车 / 臂车 · 业务员汇总 · 湖北省区域分布（武汉精确到区）</p>
      </div>
      <span class="ver">v1.4.0</span>
    </div>
    <div class="toolbar">
      <div class="select-wrap">
        <span class="select-label">业务员：</span>
        <select id="salesSelect" disabled>
          <option value="__ALL__">全部数据（汇总）</option>
        </select>
      </div>
      <button id="refreshBtn" class="ghost-btn" title="重新获取最新发布的数据">🔄 刷新数据</button>
      <span id="fileInfo" class="file-info">正在加载数据…</span>
    </div>
  </header>

  <main class="content">
    <!-- 左侧：业务员汇总表 -->
    <section class="panel table-panel">
      <div class="panel-head">
        <h2>业务员在租汇总</h2>
        <span id="tableSub" class="panel-sub"></span>
      </div>
      <div class="table-scroll">
        <table id="salesTable">
          <thead>
            <tr>
              <th class="col-name">业务员名称</th>
              <th class="col-num">剪刀车在租</th>
              <th class="col-num">臂车在租</th>
            </tr>
          </thead>
          <tbody id="salesTbody">
            <tr class="empty-row"><td colspan="3">正在加载数据…</td></tr>
          </tbody>
          <tfoot>
            <tr id="summaryRow" class="summary-row" style="display:none">
              <td class="col-name">汇总</td>
              <td class="col-num" id="sumScissor">0</td>
              <td class="col-num" id="sumBoom">0</td>
            </tr>
          </tfoot>
        </table>
      </div>
      <div class="legend">
        <span><i class="dot dot-cut"></i>剪 = 剪刀车（系列含“剪叉”）</span>
        <span><i class="dot dot-boom"></i>臂 = 臂车（其他系列）</span>
      </div>
    </section>

    <!-- 右侧：湖北地图 -->
    <section class="panel map-panel">
      <div class="panel-head">
        <h2 id="mapTitle">湖北省在租设备分布</h2>
        <span class="panel-sub">滚轮缩放 / 拖动查看，悬停查看明细</span>
      </div>
      <div id="mapChart" class="map-box">
        <div class="map-placeholder" id="mapPlaceholder">
          <div class="ph-icon">🗺️</div>
          <p id="placeholderText">正在加载数据…</p>
          <p class="ph-tip">武汉按行政区展示，其他地区按市州汇总</p>
        </div>
      </div>
      <div id="unknownCard" class="unknown-card" style="display:none">
        <b>⚠️ 未识别区域：</b>
        <span id="unknownText"></span>
        <div id="unknownSamples" class="unknown-samples"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span id="publishInfo"></span>
    <a href="./admin.html" class="admin-link" title="管理员入口">管理</a>
  </footer>

  <script src="./view.js?v=1.4.0"></script>
  <script src="./viewer-app.js?v=1.4.0"></script>
</body>
</html>
