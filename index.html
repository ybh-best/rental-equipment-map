<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>门店在租设备分布图</title>
  <link id="mainCss" rel="stylesheet" href="./style.css?v=1.7.0">
  <script>
  /* 样式表看门狗：3.5 秒没加载出来就切 gcore 镜像，避免白屏 */
  (function () {
    var l = document.getElementById('mainCss');
    var i = 0;
    var fb = [
      'https://gcore.jsdelivr.net/gh/ybh-best/rental-equipment-map@main/style.css',
      'https://fastly.jsdelivr.net/gh/ybh-best/rental-equipment-map@main/style.css',
      'https://cdn.jsdelivr.net/gh/ybh-best/rental-equipment-map@main/style.css'
    ];
    var done = false;
    l.onload = function () { done = true; };
    var t = setInterval(function () {
      if (done) { clearInterval(t); return; }
      if (i < fb.length) { l.href = fb[i++]; } else { clearInterval(t); }
    }, 3500);
  })();
  </script>
  <script>
  /* 非阻塞资源加载器（内联，本身不走网络）：
     1) echarts/xlsx 大库：本站与国内 CDN「同时并行」下载，谁先到用谁，慢线路不用干等
     2) 业务小脚本：先取本站，8 秒不通依次切 gcore/fastly/jsdelivr 等镜像
     3) 全部失败时指出具体文件，10 秒后自动重试一次，也可手动点按钮重试 */
  (function () {
    var REPO = 'ybh-best/rental-equipment-map';
    /* 大库：race 中的 CDN 与本站并行竞速；rest 是竞速全部失败后的补充链 */
    var LIBS = {
      'echarts.min.js': {
        race: ['https://registry.npmmirror.com/echarts/5.5.1/files/dist/echarts.min.js'],
        rest: ['https://unpkg.com/echarts@5.5.1/dist/echarts.min.js',
               'https://gcore.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js',
               'https://fastly.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js',
               'https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js',
               'https://cdn.staticfile.org/echarts/5.4.3/echarts.min.js']
      },
      'xlsx.full.min.js': {
        race: ['https://registry.npmmirror.com/xlsx/0.18.5/files/dist/xlsx.full.min.js'],
        rest: ['https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js',
               'https://gcore.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
               'https://fastly.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
               'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
               'https://cdn.staticfile.org/xlsx/0.18.5/xlsx.full.min.js']
      }
    };
    function appMirrors(base) {
      return ['https://gcore.jsdelivr.net/gh/' + REPO + '@main/' + base,
              'https://fastly.jsdelivr.net/gh/' + REPO + '@main/' + base,
              'https://cdn.jsdelivr.net/gh/' + REPO + '@main/' + base,
              'https://cdn.statically.io/gh/' + REPO + '/main/' + base,
              'https://raw.githubusercontent.com/' + REPO + '/main/' + base];
    }

    var LIB_TIMEOUT = 30000; /* 大库允许慢速下载，最长 30 秒 */
    var APP_TIMEOUT = 8000;

    function inject(src, timeout, ordered) {
      return new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = src;
        if (ordered) s.async = false;
        var done = false;
        var finish = function (ok) {
          if (done) return;
          done = true;
          clearTimeout(timer);
          if (!ok && s.parentNode) s.parentNode.removeChild(s);
          ok ? resolve() : reject(new Error('timeout/error'));
        };
        var timer = setTimeout(function () { finish(false); }, timeout);
        s.onload = function () { finish(true); };
        s.onerror = function () { finish(false); };
        document.head.appendChild(s);
      });
    }

    function loadLib(file) {
      var base = file.split('?')[0];
      var cfg = LIBS[base];
      /* 本站 + 国内主 CDN 同时开下，第一个成功即结束等待（败者稍后静默完成，同版本互不影响） */
      var racers = ['./' + file].concat(cfg.race).map(function (u) {
        return inject(u, LIB_TIMEOUT, false);
      });
      return Promise.any(racers).catch(function () {
        return cfg.rest.reduce(function (p, u) {
          return p.catch(function () { return inject(u, LIB_TIMEOUT, false); });
        }, Promise.reject());
      });
    }

    var appCdnFirst = false; /* 本站业务脚本一旦不通，后续文件直接走镜像 */
    function loadApp(file) {
      var base = file.split('?')[0];
      var sources = appCdnFirst ? appMirrors(base) : ['./' + file].concat(appMirrors(base));
      return sources.reduce(function (p, u) {
        return p.catch(function () {
          return inject(u, APP_TIMEOUT, true).then(function () {
            if (u !== './' + file) appCdnFirst = true;
          });
        });
      }, Promise.reject());
    }

    var retried = false;
    function failBar(name) {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99999;background:#b3261e;color:#fff;font:14px/1.6 sans-serif;padding:12px 14px;text-align:center';
      d.innerHTML = '⚠️ 资源 <b></b> 在本站和所有备用节点均加载失败，当前网络不稳定。'
        + '<button type="button" id="__retryBtn" style="margin-left:10px;padding:4px 12px;border:0;border-radius:6px;background:#fff;color:#b3261e;font-weight:700;cursor:pointer">立即重试</button>'
        + '<div style="font-size:12px;opacity:.85;margin-top:4px">10 秒后自动重试；也可切换网络（如手机热点）后按 Ctrl+F5 强刷</div>';
      d.querySelector('b').textContent = name;
      document.body.appendChild(d);
      document.getElementById('__retryBtn').onclick = function () { location.reload(); };
      if (!retried) { retried = true; setTimeout(function () { location.reload(); }, 10000); }
    }

    /* libs：大库（并行竞速）；apps：业务脚本（按数组顺序加载） */
    window.__boot = async function (libs, apps) {
      var i;
      for (i = 0; i < libs.length; i++) {
        try { await loadLib(libs[i]); } catch (e) { failBar(libs[i]); return; }
      }
      for (i = 0; i < apps.length; i++) {
        try { await loadApp(apps[i]); } catch (e) { failBar(apps[i]); return; }
      }
    };
  })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">📍</span>
      <div>
        <h1>门店在租设备分布图</h1>
        <p>剪刀车 / 臂车 · 业务员汇总 · 湖北省区域分布（武汉合并为四大区域）</p>
      </div>
      <span class="ver">v1.6.0</span>
    </div>
    <div class="toolbar">
      <div class="select-wrap">
        <span class="select-label">业务员：</span>
        <select id="salesSelect" disabled>
          <option value="__ALL__">全部数据（汇总）</option>
        </select>
      </div>
      <button id="refreshBtn" class="ghost-btn" title="重新获取最新发布的数据">🔄 刷新数据</button>
      <span id="fileInfo" class="file-info">正在加载数据…</span>
    </div>
  </header>

  <main class="content">
    <!-- 左侧：业务员汇总表 -->
    <section class="panel table-panel">
      <div class="panel-head">
        <h2>业务员在租汇总</h2>
        <span id="tableSub" class="panel-sub"></span>
      </div>
      <div class="table-scroll">
        <table id="salesTable">
          <thead>
            <tr>
              <th class="col-name">业务员名称</th>
              <th class="col-num">剪刀车在租</th>
              <th class="col-num">臂车在租</th>
            </tr>
          </thead>
          <tbody id="salesTbody">
            <tr class="empty-row"><td colspan="3">正在加载数据…</td></tr>
          </tbody>
          <tfoot>
            <tr id="summaryRow" class="summary-row" style="display:none">
              <td class="col-name">汇总</td>
              <td class="col-num" id="sumScissor">0</td>
              <td class="col-num" id="sumBoom">0</td>
            </tr>
          </tfoot>
        </table>
      </div>
      <div class="legend">
        <span><i class="dot dot-cut"></i>剪 = 剪刀车（系列含“剪叉”）</span>
        <span><i class="dot dot-boom"></i>臂 = 臂车（其他系列）</span>
      </div>
    </section>

    <!-- 右侧：湖北地图 -->
    <section class="panel map-panel">
      <div class="panel-head">
        <h2 id="mapTitle">湖北省在租设备分布</h2>
        <span class="panel-sub">滚轮缩放 / 拖动查看，悬停查看明细</span>
      </div>
      <div class="map-toolbar">
        <label class="mt-label">区域：</label>
        <div class="region-sel" id="regionSel">
          <button type="button" class="rs-btn">全部区域</button>
          <div class="rs-list"></div>
        </div>
      </div>
      <div class="map-wrap">
        <div id="mapChart" class="map-box"></div>
        <div class="map-sum" id="mapSumCard" style="display:none"></div>
        <div class="map-placeholder" id="mapPlaceholder">
          <div class="ph-icon">🗺️</div>
          <p id="placeholderText">正在加载数据…</p>
          <p class="ph-tip">武汉合并为四大区域，其他地区按市州汇总</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span id="publishInfo"></span>
    <a href="./admin.html" class="admin-link" title="管理员入口">管理</a>
  </footer>

  <!-- 访问密码门（默认显示，脚本加载完后按授权状态自动收起） -->
  <div id="gateMask" class="gate-mask" style="display:flex">
    <form id="gateForm" class="gate-card" autocomplete="off">
      <div class="gate-icon">🔐</div>
      <h2>门店在租设备分布图</h2>
      <p class="gate-tip">请输入<b>今日访问密码</b>（6 位数字，向管理员索取，每天更新）</p>
      <input id="gateInput" class="gate-input" type="password" inputmode="numeric"
             maxlength="6" placeholder="6 位今日密码">
      <div id="gateErr" class="gate-err"></div>
      <button type="submit" class="gate-btn">进入查看</button>
    </form>
  </div>

  <script>
  /* 第1组大库并行竞速；第2组业务脚本按序加载。全程非阻塞，失败自动切镜像/重试 */
  window.__boot(
    ['echarts.min.js'],
    ['access-code.js?v=1.6.0', 'view.js?v=1.7.0', 'viewer-app.js?v=1.7.0']
  );
  </script>
</body>
</html>
